{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створення акаунту — crush</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        .register-card {
            max-width: 440px;
            padding: 1.5rem 2rem;
        }

        .register-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .register-card .btn-google {
            padding: 0.65rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .register-card .divider {
            margin: 0.75rem 0;
        }

        .register-card .form-group {
            margin-bottom: 0.65rem;
            position: relative;
        }

        .register-card .form-group label {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }

        .register-card .form-group input {
            padding: 0.6rem 0.85rem;
            font-size: 0.9rem;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 2.5rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .form-hint {
            font-size: 0.72rem;
            color: #64748b;
            margin-top: 0.15rem;
            line-height: 1.2;
        }

        .register-card .btn-submit {
            padding: 0.75rem;
            margin-top: 0.5rem;
        }

        .register-card .auth-footer {
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="login-card register-card">
        <h2>Створення акаунту</h2>

        <a href="{% url 'google_login' %}" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Зареєструватись через Gmail
        </a>

        <div class="divider">або</div>

        {% if messages %}
            <ul class="messages" style="margin-bottom: 0.5rem; padding: 0;">
                {% for message in messages %}
                    <li style="padding: 0.4rem 0.75rem; font-size: 0.75rem;">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логін</label>
                <input type="text" id="username" name="username" placeholder="alex_crush" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Мінімум 8 символів + спецсимвол" required>
                    <button type="button" class="toggle-password" onclick="togglePass('password')">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="password_confirm">Підтвердження пароля</label>
                <div class="password-wrapper">
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="Повторіть пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePass('password_confirm')">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Зареєструватися</button>
        </form>

        <div class="auth-footer">
            Вже є акаунт? <a href="{% url 'login' %}">Увійти</a>
        </div>
    </div>

    <script>
        function togglePass(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
