{% load static asset_tags %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Марина — backend · crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,700&family=Rubik+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% vstatic 'css/crush.css' %}">
    <link rel="stylesheet" href="{% vstatic 'css/demo-team.css' %}">
</head>
<body class="page-info page-demo">
    <div class="crush-viewport">
        <header class="demo-header">
            <a href="{% url 'home' %}" class="landing-logo">crush</a>
            <nav class="demo-slides" aria-label="Слайди команди">
                <a class="demo-slides__link" href="{% url 'demo_anna' %}">Анна</a>
                <a class="demo-slides__link is-active" href="{% url 'demo_maryna' %}" aria-current="page">Марина</a>
            </nav>
        </header>

        <div class="crush-frame">
            <article class="demo-slide">
                <div class="demo-photo" aria-hidden="true">
                    <span class="demo-photo__label">Фото</span>
                </div>

                <div class="demo-copy">
                    <p class="demo-role">Backend</p>
                    <h1 class="demo-name">Марина</h1>
                    <p class="demo-lead">
                        Відповідала за серверну частину crush:
                        логіку додатку, дані та підбір анкет.
                    </p>
                    <ul class="demo-points">
                        <li>Бекенд і бази даних</li>
                        <li>Свайпи, сортування та фільтрація</li>
                    </ul>
                    <p class="demo-tech">Django · PostgreSQL</p>
                </div>
            </article>

            <a class="demo-next" href="{% url 'demo_anna' %}">← Назад до Анни</a>
        </div>
    </div>
    <script src="{% vstatic 'js/crush-frame.js' %}" defer></script>
</body>
</html>
