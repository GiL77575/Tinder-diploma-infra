{% load static asset_tags %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Чат — crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;1,700&family=Rubik+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% vstatic 'css/crush.css' %}">
    <link rel="stylesheet" href="{% vstatic 'css/chat.css' %}">
</head>
<body class="page-chat"
      data-initial-mode="{{ initial_mode }}"
      data-my-user-id="{{ request.user.id }}">

<div class="crush-viewport">
    <div class="chat-page-backdrop" aria-hidden="true"></div>
    <div class="crush-frame">
        <div class="deco-hearts" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
                <symbol id="chat-heart-outline" viewBox="0 0 48 48">
                    <path d="M23.5395 15.6038C19.3697 6.75697 5.99871 8.2203 6.43215 19.7122C6.86559 31.2041 24.4645 40.1307 24.4645 40.1307C24.4645 40.1307 41.3411 29.9038 40.9076 18.4119C40.4742 6.92 27.0309 6.46802 23.5395 15.6038Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </symbol>
            </svg>
            {% for i in "12345678901" %}
                <svg class="deco-heart chat-heart--{{ forloop.counter }}" viewBox="0 0 48 48"><use href="#chat-heart-outline"></use></svg>
            {% endfor %}
        </div>

        <div class="chat-shell">
            <header class="chat-header">
                <a href="{% url 'home' %}" class="chat-logo">crush</a>

                <div class="mode-switch" role="tablist" aria-label="Режим пошуку" id="mode-switch" data-active="{{ initial_mode }}">
                    <span class="mode-switch__pill" id="mode-switch-pill" aria-hidden="true"></span>
                    <button type="button" class="mode-switch__btn" data-mode="dating" role="tab" aria-selected="{% if initial_mode != 'bff' %}true{% else %}false{% endif %}">
                        <img class="mode-switch__icon mode-switch__icon--heart" src="{% static 'img/brand/heart-signal.png' %}" width="18" height="18" alt="" aria-hidden="true">
                        Романтика
                    </button>
                    <button type="button" class="mode-switch__btn" data-mode="bff" role="tab" aria-selected="{% if initial_mode == 'bff' %}true{% else %}false{% endif %}">
                        <img class="mode-switch__icon mode-switch__icon--friends" src="{% static 'img/brand/mode-friendship.svg' %}" width="18" height="18" alt="" aria-hidden="true">
                        Дружба
                    </button>
                </div>

                <div class="chat-profile">
                    <span class="chat-profile__name">{{ my_display_name }}{% if my_age %} {{ my_age }}{% endif %}</span>
                    <a href="{% url 'profile_me' %}" class="chat-profile__avatar" title="Мій профіль">
                        {% if my_avatar_url %}
                            <img src="{{ my_avatar_url }}" alt="{{ my_display_name }}">
                        {% else %}
                            <img src="{% static 'img/brand/user.png' %}" width="42" height="42" alt="" aria-hidden="true">
                        {% endif %}
                    </a>
                </div>
            </header>

            <div class="chat-body">
                <aside class="chat-sidebar" id="chat-sidebar">
                    <section class="panel matches-panel">
                        <h2 class="panel__title">
                            Метчі
                            <img class="panel__title-icon panel__title-icon--heart" src="{% static 'img/brand/hearts-glow.png' %}" width="18" height="18" alt="" aria-hidden="true">
                        </h2>
                        <div class="matches-wrap">
                            <div class="matches-grid" id="matches-grid">
                                <p class="panel__empty" data-empty-for="matches">Поки немає метчів у цьому режимі</p>
                            </div>
                            <button type="button" class="matches-more" id="matches-more" hidden aria-label="Більше метчів">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M9 5l7 7-7 7" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </section>

                    <section class="panel dialogs-panel">
                        <h2 class="panel__title">
                            Діалоги
                            <img class="panel__title-icon panel__title-icon--chat" src="{% static 'img/brand/thought-bubble.png' %}" width="18" height="18" alt="" aria-hidden="true">
                        </h2>
                        <div class="dialogs-list" id="dialogs-list">
                            <p class="panel__empty" data-empty-for="dialogs">Тут з'являться ваші діалоги</p>
                        </div>
                    </section>
                </aside>

                <main class="chat-main">
                    <section class="discover-view" id="discover-view">
                        <div class="discover-stage">
                            <div class="swipe-card-frame">
                                <div class="swipe-card" id="swipe-card">
                                    <div class="swipe-card__placeholder" id="swipe-card-placeholder">
                                        <p>Шукаємо анкети…</p>
                                    </div>
                                </div>
                                <button type="button" class="swipe-card__expand" id="expand-profile-btn" aria-label="Розгорнути повний профіль" hidden>
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M9 5l7 7-7 7" stroke="#161616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="swipe-actions" id="swipe-actions" hidden>
                            <button type="button" class="swipe-btn swipe-btn--dislike" id="dislike-btn" aria-label="Пропустити">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M5 5L19 19M19 5L5 19" stroke="#161616" stroke-width="2.6" stroke-linecap="round"/>
                                </svg>
                            </button>
                            <button type="button" class="swipe-btn swipe-btn--like" id="like-btn" aria-label="Подобається">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M12 20.5s-7.5-4.6-10-9.4C.4 7.7 2 4 5.6 3.4 8 3 10.4 4.3 12 6.5c1.6-2.2 4-3.5 6.4-3.1C22 4 23.6 7.7 22 11.1c-2.5 4.8-10 9.4-10 9.4z" stroke="#FFFDFE" stroke-width="2.2" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </section>

                    <section class="chat-view" id="chat-view" hidden>
                        <header class="chat-view__header">
                            <button type="button" class="chat-view__back" id="chat-back-btn" aria-label="Назад до анкет">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M15 5l-7 7 7 7" stroke="#161616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <img class="chat-view__avatar" id="chat-partner-avatar" src="" alt="" hidden>
                            <div class="chat-view__meta">
                                <span class="chat-view__name" id="chat-partner-name"></span>
                                <span class="chat-view__status" id="chat-partner-status"></span>
                            </div>
                        </header>

                        <div class="chat-view__messages" id="chat-messages"></div>

                        <form class="chat-view__composer" id="chat-form" autocomplete="off">
                            <input type="text" id="chat-input" name="text" placeholder="Написати повідомлення…" maxlength="2000" required>
                            <button type="submit" class="chat-view__send" aria-label="Надіслати">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M5 12h12M13 6l6 6-6 6" stroke="#FFFDFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </form>
                    </section>
                </main>
            </div>

            <div class="full-profile-overlay" id="full-profile-overlay" hidden>
                <div class="full-profile-overlay__backdrop" id="full-profile-backdrop"></div>
                <div class="full-profile" role="dialog" aria-modal="true" aria-labelledby="full-profile-name">
                    <button type="button" class="full-profile__close" id="full-profile-close" aria-label="Закрити">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M5 5L19 19M19 5L5 19" stroke="#161616" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="full-profile__gallery">
                        <img class="full-profile__main-photo" id="full-profile-main-photo" src="" alt="">
                        <div class="full-profile__thumbs" id="full-profile-thumbs"></div>
                    </div>
                    <div class="full-profile__content">
                        <div class="full-profile__header">
                            <h2 class="full-profile__name" id="full-profile-name"></h2>
                            <p class="full-profile__city" id="full-profile-city"></p>
                            <p class="full-profile__bio" id="full-profile-bio"></p>
                        </div>
                        <div class="full-profile__tags" id="full-profile-tags"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% vstatic 'js/crush-frame.js' %}" defer></script>
<script src="{% vstatic 'js/chat.js' %}" defer></script>
</body>
</html>
