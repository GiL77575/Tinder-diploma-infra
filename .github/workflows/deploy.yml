name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build Docker Services
        run: |
          docker compose build

      - name: CI OK (prod is VPS)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "CI passed. Production runs on VPS (Docker Compose), not Render."
          echo "Deploy on the server: git pull && docker compose up -d --build"
