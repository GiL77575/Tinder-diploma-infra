version: '3.8'

services:
  # 1. Основная база данных (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: tinder_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tinder_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tinder_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis — быстрый кэш и сессии
  redis:
    image: redis:7-alpine
    container_name: tinder_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # 3. Django Бэкенд + Шаблоны (HTMX / JS / CSS)
  web:
    build: ./backend
    container_name: tinder_django
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-tinder_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      REDIS_URL: redis://redis:6379/0
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,crush.pp.ua}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000,https://crush.pp.ua}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-1}
      DEBUG: ${DEBUG:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
