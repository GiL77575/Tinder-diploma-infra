# Додати ЦІ location у вже існуючий server { } для crush.pp.ua
# (перед location /). gunicorn/WSGI ігнорує Upgrade — чат тоді 404.
# Застосунок: daphne -b 127.0.0.1 -p 8000 config.asgi:application
#
# sudo nginx -t && sudo systemctl reload nginx
#
# Якщо вже є location /media/ з alias на порожню папку — ЗАМІНИТИ на цей
# proxy_pass, інакше фото зустрічей у чатах будуть 403.

# Локальні завантаження (якщо CLOUDINARY_URL порожній).
# Хост-шлях = ./backend/media з репо (у контейнері: /app/media).
# Якщо Django сам віддає /media/ (config/urls.py) — цей block можна не додавати.
location /media/ {
    alias /path/to/Tinder-diploma-infra/backend/media/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}

location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

location /media/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
